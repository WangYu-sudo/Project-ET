{% extends 'base.html' %}

{% block title %}考试已结束{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm text-center py-5">
            <div class="card-body">
                <i class="bi bi-hourglass-split display-1 text-muted"></i>
                <h3 class="mt-3">考试已结束，不能再提交</h3>
                <p class="text-muted">
                    本场考试「{{ exam.name if exam else '' }}」已结束或已清理，答卷通道已关闭。
                </p>
                <a class="btn btn-primary" href="{{ url_for('auth.logout') }}">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
