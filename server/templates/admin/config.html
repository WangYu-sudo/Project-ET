{% extends 'base.html' %}

{% block title %}系统配置 - 管理员后台{% endblock %}

{% block content %}
<!-- 管理员子导航 -->
<nav class="nav nav-pills mb-3 bg-light p-2 rounded">
    <a class="nav-link" href="{{ url_for('admin.teacher_list') }}">
        <i class="bi bi-people-fill"></i> 教师管理
    </a>
    <a class="nav-link" href="{{ url_for('admin.exam_list') }}">
        <i class="bi bi-journal-text"></i> 考试管理
    </a>
    <a class="nav-link active" href="{{ url_for('admin.system_config') }}">
        <i class="bi bi-gear-fill"></i> 系统配置
    </a>
</nav>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-gear-fill"></i> 系统配置</h5>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('admin.system_config') }}">
                    {% for key, label in editable_keys %}
                    <div class="mb-3">
                        <label class="form-label">{{ label }}</label>
                        <input type="text" name="{{ key }}" class="form-control"
                               value="{{ configs.get(key, '') }}">
                    </div>
                    {% endfor %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> 保存配置
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
